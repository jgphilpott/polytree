name: Deploy Examples to GitHub Pages

on:
  push:
    branches: [ "polytree" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Build Polytree bundles
      run: npm run build

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Prepare GitHub Pages deployment
      run: |
        mkdir -p _deploy
        cp -r examples/* _deploy/
        cp polytree.bundle.browser.js _deploy/
        cp polytree.bundle.browser.min.js _deploy/
        cp icon.png _deploy/
        sed -i 's|"../polytree.bundle.browser.js"|"./polytree.bundle.browser.js"|g' _deploy/*.html
        sed -i 's|"../icon.png"|"./icon.png"|g' _deploy/*.html
        sed -i 's|"../textures/|"./textures/|g' _deploy/*.html

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './_deploy'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/polytree'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
