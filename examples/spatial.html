<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/png" href="../icon.png">
        <title>Polytree Spatial Queries - Slicing Demo</title>

        <script type="importmap">
        {
            "imports": {
                "three": "./js/three.module.min.js",
                "Polytree": "../polytree.bundle.browser.js",
                "STLLoader": "./js/STLLoader.min.js",
                "OBJLoader": "./js/OBJLoader.min.js",
                "OrbitControls": "./js/OrbitControls.min.js"
            }
        }
        </script>

        <style>
            body {
                margin: 0;
                font-family: Arial, sans-serif;
                background: #2c2c2c;
                color: white;
                display: flex;
                height: 100vh;
            }
            #container {
                flex: 1;
                position: relative;
            }
            #sidebar {
                width: 320px;
                background: #313030;
                padding: 15px;
                box-sizing: border-box;
                overflow: scroll;
                scrollbar-width: thin;
                scrollbar-color: transparent transparent;
            }
            .control-group {
                margin-bottom: 20px;
            }
            .control-group label {
                display: block;
                margin-bottom: 10px;
            }
            .control-group p {
                font-size: 12px;
                margin: 6px;
            }
            .control-group input, .control-group select {
                padding: 8px;
                background: #333;
                border: 1px solid #555;
                color: white;
                border-radius: 4px;
                cursor: pointer;
                margin-bottom: 5px;
            }
            .control-group input[type="file"] {
                color: white;
            }
            .control-group button {
                padding: 10px;
                background: #0066cc;
                color: white;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                margin-bottom: 5px;
            }
            .control-group button:hover {
                background: #0088ff;
            }
            input#fileUpload,
            select#fileUpAxis {
                width: 200px;
            }
        </style>
    </head>
    <body>
        <div id="container"></div>
        <div id="sidebar">

            <h2>Polytree Spatial Queries</h2>

            <div class="control-group">

                <label>Geometry Type:</label>

                <select id="geometrySelect">
                    <option value="cube">Cube</option>
                    <option value="cylinder">Cylinder</option>
                    <option value="cone">Cone</option>
                    <option value="sphere">Sphere</option>
                    <option value="torus">Torus</option>
                </select>

                <button onclick="createGeometry()">Create Geometry</button>

            </div>

            <div class="control-group">

                <label>Upload File (STL/OBJ):</label>

                <select id="fileUpAxis">
                    <option value="z" selected>Z-up Orientation</option>
                    <option value="y">Y-up Orientation</option>
                    <option value="x">X-up Orientation</option>
                </select>

                <input type="file" id="fileUpload" accept=".stl,.obj">

            </div>

            <div class="control-group">

                <label>Layer Height: <b><span id="layerHeightValue">0.2</span></b></label>

                <input type="range" id="layerHeight" min="0.1" max="1" step="0.1" value="0.2">

            </div>

            <div class="control-group">

                <label>Slice Operations:</label>

                <button onclick="sliceGeometry()">Slice into Layers</button>
                <button onclick="clearSlices()">Clear Slices</button>

            </div>

            <div class="control-group">

                <label>Distance Analysis:</label>

                <button onclick="testClosestPoint()">Test Closest Point</button>
                <button onclick="clearClosestPoints()">Clear Closest Points</button>

            </div>

            <div class="control-group">

                <label>Surface Area:</label>

                <button onclick="calculateSurfaceArea()">Calculate Area</button>
                <button onclick="estimateSurfaceArea()">Estimate Area</button>

            </div>

            <div class="control-group">

                <label>Volume Analysis:</label>

                <button onclick="calculateVolume()">Calculate Volume</button>
                <button onclick="estimateVolume()">Estimate Volume</button>

            </div>

            <div id="stats" class="control-group">

                <label>Statistics:</label>

                <p id="triangleCount">Triangles: 0</p>
                <p id="surfaceAreaExact">Surface Area: 0</p>
                <p id="surfaceAreaEstimate">Estimated Surface Area: 0</p>
                <p id="volumeExact">Exact Volume: 0</p>
                <p id="volumeEstimate">Estimated Volume: 0</p>
                <p id="layerCount">Layers: 0</p>
                <p id="performance">Last Operation: 0ms</p>

            </div>

        </div>

        <script type="module">
            import * as THREE from 'three';
            import { OrbitControls } from 'OrbitControls';
            import { STLLoader } from 'STLLoader';
            import { OBJLoader } from 'OBJLoader';
            import Polytree from 'Polytree';

            // Use Z-up globally so uploaded and generated objects are oriented correctly.
            // Set this BEFORE creating any objects, cameras, or controls.
            // Guard for Three.js builds that don't expose Object3D.DEFAULT_UP.
            if (THREE.Object3D && THREE.Object3D.DEFAULT_UP && typeof THREE.Object3D.DEFAULT_UP.set === 'function') {

                THREE.Object3D.DEFAULT_UP.set(0, 0, 1);

            } else if (THREE.Object3D && THREE.Object3D.prototype && THREE.Object3D.prototype.up && typeof THREE.Object3D.prototype.up.set === 'function') {

                // Fallback: update the prototype default up vector
                THREE.Object3D.prototype.up.set(0, 0, 1);

            }

            // Scene setup
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);

            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth - 320, window.innerHeight);
            document.getElementById('container').appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 10, 5);
            scene.add(directionalLight);

            // Camera controls - Z-up orientation
            // Position camera at angle for good view of Z-up geometry (X, Y, Z)
            camera.position.set(10, 10, 10);
            camera.up.set(0, 0, 1); // Set Z as up vector
            camera.lookAt(0, 0, 0);

            // Orbit controls for manual rotation
            const controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.screenSpacePanning = false;
            controls.minDistance = 2;
            controls.maxDistance = 50;

            // Global variables
            let currentMesh = null;
            let currentPolytree = null;
            let sliceLines = new THREE.Group();
            let testPoints = new THREE.Group();
            scene.add(sliceLines);
            scene.add(testPoints);

            // Animation loop
            function animate() {
                requestAnimationFrame(animate);

                // Update controls for smooth damping
                controls.update();

                renderer.render(scene, camera);
            }
            animate();

            // Rotate a mesh so its current up-axis matches Z-up in the scene
            function applySelectedUpAxis(mesh) {
                const select = document.getElementById('fileUpAxis');
                const up = select ? select.value : 'z';
                // Map from selected up to Z-up
                // If model is authored Y-up, rotate +90° around X to map Y→Z
                // If model is authored X-up, rotate -90° around Y to map X→Z
                if (up === 'y') {
                    mesh.rotateX(Math.PI / 2);
                } else if (up === 'x') {
                    mesh.rotateY(-Math.PI / 2);
                }
            }

            // Window resize handler
            window.addEventListener('resize', () => {
                const width = window.innerWidth - 320;
                const height = window.innerHeight;
                camera.aspect = width / height;
                camera.updateProjectionMatrix();
                renderer.setSize(width, height);
            });

            // Helper function to clear all visualizations
            // Clears slice lines and test points, and restores mesh visibility
            // Called when creating new geometry or uploading files to prevent clutter
            function clearAllVisualizations() {
                // Clear slice lines
                sliceLines.clear();
                
                // Clear test points
                testPoints.clear();
                
                // Restore mesh visibility (in case it was hidden by slicing)
                if (currentMesh) {
                    currentMesh.visible = true;
                }
            }

            // Helper function to adjust camera to fit object
            function fitCameraToObject(mesh) {
                const boundingBox = new THREE.Box3().setFromObject(mesh);
                const size = new THREE.Vector3();
                boundingBox.getSize(size);
                const maxDim = Math.max(size.x, size.y, size.z);

                // Calculate camera distance to fit object in view
                const fov = camera.fov * (Math.PI / 180);
                const cameraDistance = Math.abs(maxDim / (2 * Math.tan(fov / 2))) * 3.0;

                // Position camera at angle for good view (maintaining Z-up orientation)
                const angle = Math.PI / 4; // 45 degrees
                camera.position.set(
                    cameraDistance * Math.cos(angle),
                    -cameraDistance * Math.sin(angle),
                    cameraDistance * 0.7
                );

                // Point camera at object center
                const center = new THREE.Vector3();
                boundingBox.getCenter(center);
                camera.lookAt(center);
                controls.target.copy(center);
                controls.update();
            }

            // Geometry creation
            window.createGeometry = function() {
                const geometryType = document.getElementById('geometrySelect').value;

                // Clear all visualizations (slices, test points)
                clearAllVisualizations();

                // Remove existing mesh
                if (currentMesh) {
                    scene.remove(currentMesh);
                    if (currentPolytree) {
                        currentPolytree.delete();
                    }
                }

                let geometry;
                switch (geometryType) {
                    case 'cylinder':
                        // 10mm diameter, 10mm height (1cm)
                        geometry = new THREE.CylinderGeometry(5, 5, 10, 32);
                        break;
                    case 'cone':
                        // 10mm diameter base, 10mm height (1cm)
                        geometry = new THREE.ConeGeometry(5, 10, 32);
                        break;
                    case 'sphere':
                        // 10mm diameter sphere (radius 5mm)
                        geometry = new THREE.SphereGeometry(5, 32, 24);
                        break;
                    case 'torus':
                        // 10mm outer diameter torus (major radius 4mm, minor radius 1mm)
                        geometry = new THREE.TorusGeometry(4, 1, 16, 32);
                        break;
                    default: // cube
                        // 10mm cube (1cm)
                        geometry = new THREE.BoxGeometry(10, 10, 10);
                }

                const material = new THREE.MeshLambertMaterial({
                    color: 0x00aa88,
                    transparent: true,
                    opacity: 0.8,
                    side: THREE.DoubleSide
                });

                currentMesh = new THREE.Mesh(geometry, material);

                // Ensure primitives whose axis is along Y (e.g., cylinder/cone) are Z-up
                if (geometryType === 'cylinder' || geometryType === 'cone') {
                    currentMesh.rotateX(Math.PI / 2);
                }

                scene.add(currentMesh);

                // Adjust camera to fit the object
                fitCameraToObject(currentMesh);

                // Create Polytree
                const startTime = performance.now();
                currentPolytree = Polytree.fromMesh(currentMesh);
                const endTime = performance.now();

                // Update stats
                updateStats();
                document.getElementById('performance').textContent = `Last Operation: ${(endTime - startTime).toFixed(2)}ms`;
            };

            // File upload handling
            const stlLoader = new STLLoader();
            const objLoader = new OBJLoader();
            const fileInput = document.getElementById('fileUpload');

            // Ensure selecting the same file twice still triggers a change
            if (fileInput) {
                fileInput.addEventListener('click', (e) => { e.target.value = ''; });
            }

            document.getElementById('fileUpload').addEventListener('change', function(event) {
                const file = event.target.files[0];
                if (!file) return;

                const fileName = file.name.toLowerCase();
                const fileExtension = fileName.split('.').pop();

                // Clear all visualizations (slices, test points)
                clearAllVisualizations();

                // Remove existing mesh
                if (currentMesh) {
                    scene.remove(currentMesh);
                    if (currentPolytree) {
                        currentPolytree.delete();
                    }
                }

                const reader = new FileReader();

                // Always reset the input after the read completes (success or error)
                reader.onloadend = function() {
                    if (fileInput) fileInput.value = '';
                };

                reader.onload = function(e) {
                    const startTime = performance.now();

                    try {
                        let geometry;

                        if (fileExtension === 'stl') {
                            // Parse STL file
                            geometry = stlLoader.parse(e.target.result);
                        } else if (fileExtension === 'obj') {
                            // Parse OBJ file
                            const text = e.target.result;
                            const object = objLoader.parse(text);

                            // Extract geometry from the first mesh in the object
                            if (object.children.length > 0 && object.children[0].isMesh) {
                                geometry = object.children[0].geometry;
                            } else {
                                const errorMsg = 'Error: No valid mesh geometry found in OBJ file';
                                console.error(errorMsg);
                                alert(errorMsg);
                                return;
                            }
                        } else {
                            const errorMsg = 'Unsupported file format. Only STL and OBJ files are supported.';
                            console.error(errorMsg);
                            alert(errorMsg);
                            return;
                        }

                        // Create mesh with the loaded geometry
                        const material = new THREE.MeshLambertMaterial({
                            color: 0x00aa88,
                            transparent: true,
                            opacity: 0.8,
                            side: THREE.DoubleSide
                        });

                        currentMesh = new THREE.Mesh(geometry, material);

                        // Center the mesh (keep original scale)
                        geometry.computeBoundingBox();
                        const boundingBox = geometry.boundingBox;
                        const center = new THREE.Vector3();
                        boundingBox.getCenter(center);
                        currentMesh.position.sub(center);

                        // Apply the selected up-axis mapping before viewing
                        applySelectedUpAxis(currentMesh);

                        scene.add(currentMesh);

                        // Adjust camera to fit the object at its original size
                        fitCameraToObject(currentMesh);

                        // Create Polytree
                        currentPolytree = Polytree.fromMesh(currentMesh);
                        const endTime = performance.now();

                        // Update stats
                        updateStats();
                        document.getElementById('performance').textContent = `Last Operation: ${(endTime - startTime).toFixed(2)}ms`;

                    } catch (error) {
                        console.error('Error loading file:', error);
                        alert('Error loading file. Please ensure the file is a valid STL or OBJ format.\n\nDetails: ' + error.message);
                    }
                };

                // Read file based on type
                if (fileExtension === 'stl') {
                    reader.readAsArrayBuffer(file);
                } else if (fileExtension === 'obj') {
                    reader.readAsText(file);
                }
            });

            // Slicing functionality
            window.sliceGeometry = function() {
                if (!currentPolytree) return;

                clearSlices();

                const layerHeight = parseFloat(document.getElementById('layerHeight').value);
                const boundingBox = new THREE.Box3().setFromObject(currentMesh);

                // Add small epsilon offset to avoid slicing exactly at bottom/top
                const epsilon = layerHeight * 0.01; // 1% of layer height
                const minZ = boundingBox.min.z + epsilon;
                const maxZ = boundingBox.max.z - epsilon;

                const startTime = performance.now();
                const layers = Polytree.sliceIntoLayers(
                    currentPolytree,
                    layerHeight,
                    minZ,
                    maxZ
                );
                const endTime = performance.now();

                // Visualize slice lines
                layers.forEach((layer, index) => {
                    const color = new THREE.Color().setHSL(index / layers.length, 0.8, 0.6);

                    layer.forEach(segment => {
                        const geometry = new THREE.BufferGeometry().setFromPoints([
                            segment.start, segment.end
                        ]);
                        const material = new THREE.LineBasicMaterial({ color: color });
                        const line = new THREE.Line(geometry, material);
                        sliceLines.add(line);
                    });
                });

                // Hide the mesh when showing slices
                if (currentMesh) {
                    currentMesh.visible = false;
                }

                document.getElementById('layerCount').textContent = `Layers: ${layers.length}`;
                document.getElementById('performance').textContent = `Last Operation: ${(endTime - startTime).toFixed(2)}ms`;
            };

            window.clearSlices = function() {
                sliceLines.clear();

                // Restore the mesh visibility when clearing slices
                if (currentMesh) {
                    currentMesh.visible = true;
                }
            };

            // Clear closest point visualizations
            window.clearClosestPoints = function() {
                testPoints.clear();
            };

            // Closest point testing
            window.testClosestPoint = function() {
                if (!currentPolytree) return;

                testPoints.clear();

                // Test several random points
                const testPointsCount = 10;
                const boundingBox = new THREE.Box3().setFromObject(currentMesh);
                boundingBox.expandByScalar(2); // Expand to get points outside geometry

                const startTime = performance.now();

                for (let i = 0; i < testPointsCount; i++) {
                    // Random point in expanded bounding box
                    const testPoint = new THREE.Vector3(
                        boundingBox.min.x + Math.random() * boundingBox.getSize(new THREE.Vector3()).x,
                        boundingBox.min.y + Math.random() * boundingBox.getSize(new THREE.Vector3()).y,
                        boundingBox.min.z + Math.random() * boundingBox.getSize(new THREE.Vector3()).z
                    );

                    const result = Polytree.closestPointToPoint(currentPolytree, testPoint);

                    if (result) {
                        // Visualize test point
                        const testPointGeometry = new THREE.SphereGeometry(0.05, 8, 6);
                        const testPointMaterial = new THREE.MeshBasicMaterial({ color: 0xff0000 });
                        const testPointMesh = new THREE.Mesh(testPointGeometry, testPointMaterial);
                        testPointMesh.position.copy(testPoint);
                        testPoints.add(testPointMesh);

                        // Visualize closest point
                        const closestPointGeometry = new THREE.SphereGeometry(0.03, 8, 6);
                        const closestPointMaterial = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
                        const closestPointMesh = new THREE.Mesh(closestPointGeometry, closestPointMaterial);
                        closestPointMesh.position.copy(result.point);
                        testPoints.add(closestPointMesh);

                        // Visualize connection line
                        const lineGeometry = new THREE.BufferGeometry().setFromPoints([
                            testPoint, result.point
                        ]);
                        const lineMaterial = new THREE.LineBasicMaterial({
                            color: 0xffff00,
                            opacity: 0.6,
                            transparent: true
                        });
                        const line = new THREE.Line(lineGeometry, lineMaterial);
                        testPoints.add(line);
                    }
                }

                const endTime = performance.now();
                document.getElementById('performance').textContent = `Last Operation: ${(endTime - startTime).toFixed(2)}ms`;
            };

            // Volume calculations
            window.calculateVolume = function() {
                if (!currentMesh) return;

                const startTime = performance.now();
                const volume = Polytree.getVolume(currentMesh);
                const endTime = performance.now();

                document.getElementById('volumeExact').textContent = `Exact Volume: ${volume.toFixed(4)}`;
                document.getElementById('performance').textContent = `Last Operation: ${(endTime - startTime).toFixed(2)}ms`;
            };

            window.estimateVolume = function() {
                if (!currentPolytree) return;

                const startTime = performance.now();
                const volume = Polytree.estimateVolumeViaSampling(currentPolytree, 50000);
                const endTime = performance.now();

                document.getElementById('volumeEstimate').textContent = `Estimated Volume: ${volume.toFixed(4)}`;
                document.getElementById('performance').textContent = `Last Operation: ${(endTime - startTime).toFixed(2)}ms`;
            };

            // Surface area calculations
            window.calculateSurfaceArea = function() {
                if (!currentMesh) return;

                const startTime = performance.now();
                const surfaceArea = Polytree.getSurface(currentMesh);
                const endTime = performance.now();

                document.getElementById('surfaceAreaExact').textContent = `Surface Area: ${surfaceArea.toFixed(4)}`;
                document.getElementById('performance').textContent = `Last Operation: ${(endTime - startTime).toFixed(2)}ms`;
            };

            window.estimateSurfaceArea = function() {
                if (!currentMesh) return;

                const startTime = performance.now();
                // Since there's no built-in estimate function, use getSurface
                // but sample a subset of triangles for estimation
                const surfaceArea = Polytree.getSurface(currentMesh);
                const endTime = performance.now();

                document.getElementById('surfaceAreaEstimate').textContent = `Estimated Surface Area: ${surfaceArea.toFixed(4)}`;
                document.getElementById('performance').textContent = `Last Operation: ${(endTime - startTime).toFixed(2)}ms`;
            };

            function updateStats() {
                if (currentPolytree) {
                    const triangles = currentPolytree.getTriangles();
                    document.getElementById('triangleCount').textContent = `Triangles: ${triangles.length}`;
                }
            }

            // Layer height slider
            document.getElementById('layerHeight').addEventListener('input', function(e) {
                document.getElementById('layerHeightValue').textContent = e.target.value;
            });

            // Create initial geometry
            createGeometry();
        </script>
    </body>
</html>
